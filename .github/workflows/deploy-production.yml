name: Deploy Sweetia demo VPS

on:
  push:
    branches:
      - codex/laravel-12-upgrade
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sweetia-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/codex/laravel-12-upgrade'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy the active VPS branch
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${VPS_HOST:?Set the VPS_HOST repository secret}"
          : "${VPS_SSH_KEY:?Set the VPS_SSH_KEY repository secret}"
          : "${VPS_KNOWN_HOSTS:?Set the VPS_KNOWN_HOSTS repository secret}"
          VPS_PORT="${VPS_PORT:-22}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "deploy@$VPS_HOST" \
            'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          APP_DIR=/var/www/sweetia
          DEPLOY_BRANCH=codex/laravel-12-upgrade

          git -C "$APP_DIR" fetch origin "$DEPLOY_BRANCH"
          if git -C "$APP_DIR" show-ref --verify --quiet "refs/heads/$DEPLOY_BRANCH"; then
              git -C "$APP_DIR" switch "$DEPLOY_BRANCH"
          else
              git -C "$APP_DIR" switch --track -c "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
          fi
          git -C "$APP_DIR" pull --ff-only origin "$DEPLOY_BRANCH"

          bash "$APP_DIR/scripts/deploy-production.sh"
          REMOTE

      - name: Check the public storefront
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in {1..10}; do
            if curl --fail --silent --show-error --location https://sweetia.mohamad.tn/ >/dev/null; then
              echo "Sweetia storefront is responding over HTTPS."
              exit 0
            fi
            sleep 6
          done
          echo "Sweetia storefront did not pass the HTTPS check after deployment." >&2
          exit 1
